[LCGarage]
; Garage doors: where you stop to honk, facing the door: x y z heading.
; Garage1 is the Lost clubhouse in Acter. Add Garage2 ... Garage8 for more;
; they all share the same cars.
Garage1=-1743.04 330.93 24.95 236.21

; How many cars the garage holds (up to 64)
Slots=20

; Key to open the garage list, on foot at a door (F1-F24 or a single letter)
TakeOutKey=F6

; Honk this close (metres) to a door to store the car
StoreDistance=8
; Stand this close (metres) to a door to open the list
TakeOutDistance=12
; Which way a car faces when it comes out, in degrees turned from facing the door
; (180 = straight out)
ExitTurn=180

; Your LibertyCityPlates vehicles.ide, for random plates. Blank = found automatically
; (update\common\data\vehicles.ide, then common\data\vehicles.ide)
PlatesIde=
